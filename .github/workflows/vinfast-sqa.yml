name: VinFast SOA - SQA integration evidence

# Run automatically for this isolated testing PR; after merge, allow manual reruns.
# No push trigger; the project application and main branch remain untouched.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vinfast-sqa.yml'
      - '.github/qa/**'
      - 'VinFast-SOA-Project-master/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinfast-sqa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Docker Compose and API integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PROJECT_DIR: VinFast-SOA-Project-master
      EVIDENCE_DIR: ${{ github.workspace }}/qa-evidence
    steps:
      - name: Checkout the exact version under test
        uses: actions/checkout@v4

      - name: Prepare isolated, clean SQLite data
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$EVIDENCE_DIR/baseline.txt"
          # These are only checked-out COPIES of the database files on the hosted runner.
          find "$PROJECT_DIR" -type f -name '*.db' -delete
          docker version > "$EVIDENCE_DIR/docker_version.txt" 2>&1
          docker compose version >> "$EVIDENCE_DIR/docker_version.txt" 2>&1
          docker compose -f "$PROJECT_DIR/docker-compose.yml" config --quiet

      - name: Build and start six services
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose up --build -d

      - name: Wait until Catalog and User endpoints respond
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error, sys
          catalog = 'http://127.0.0.1:8000/catalog/catalog/cars'
          user = 'http://127.0.0.1:8000/users/users/login'
          for attempt in range(90):
              try:
                  with urllib.request.urlopen(catalog, timeout=3) as r:
                      if r.status != 200 or not isinstance(json.loads(r.read()), list):
                          raise ValueError('Catalog response is not an array')
                  req = urllib.request.Request(user, data=b'{"email":"probe.invalid@example.test","password":"invalid"}', headers={'Content-Type':'application/json'}, method='POST')
                  try:
                      urllib.request.urlopen(req, timeout=3)
                  except urllib.error.HTTPError as e:
                      if e.code != 401:
                          raise
                  print('Both endpoints are responding')
                  sys.exit(0)
              except Exception:
                  time.sleep(3)
          print('Timed out waiting for endpoints', file=sys.stderr)
          sys.exit(1)
          PY

      - name: Run API checks on temporary CI data
        run: |
          python3 .github/qa/run_integration.py \
            --base-url http://127.0.0.1:8000 \
            --output "$EVIDENCE_DIR"

      - name: Capture service logs and environment evidence
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          docker compose ps -a > "$EVIDENCE_DIR/compose_ps.txt" 2>&1 || true
          # Exclude demo credentials and avoid persisting JWT tokens.
          docker compose logs --no-color --timestamps 2>&1 |
            sed -E 's@(admin@vinfast\.com)[[:space:]]*/[[:space:]]*[^[:space:]]+@\1 / [REDACTED]@g' \
            > "$EVIDENCE_DIR/compose_logs.txt" || true
          printf 'Repository: %s\nSHA: %s\nWorkflow: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKFLOW" \
            > "$EVIDENCE_DIR/build_metadata.txt"

      - name: Upload evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinfast-sqa-evidence-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop temporary services
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker compose down --remove-orphans || true
